name: Terraform Module Pipeline
run-name: CI/CD Pipeline for Terraform Module
permissions:
  contents: write

on:
  push:
    branches:
      - master    
env:
 TF_LOG: INFO
 AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
 AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 TF_WORKING_DIR: .
 TF_VERSION: 1.12.2
 TF_PLUGIN_CACHE_DIR: ${{ env.HOME }}/.terraform.d/plugin-cache
 PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: aws cli setup
        uses: ./.github/actions/aws_cli

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Install Terraform
        uses: ./.github/actions/terraform

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: ./.github/actions/tflint
        
      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      - name: Install Checkov Dependencies
        uses: ./.github/actions/checkov

      - name: Checkov Scan
        run: |
          $HOME/.checkov-env/bin/checkov \
            -d . \
            --download-external-modules true \
            --skip-check CKV_GHA_7,CKV_TF_1 \
            --soft-fail

  module_validation:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/terraform
      
      - name: Terraform Initialize
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan -var-file=variables/dev_ci.tfvars -out=tfplan
      
      - name: Show Terraform Plan
        run: terraform show -no-color tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var-file=variables/dev_ci.tfvars \
            -auto-approve
  
  release:
    runs-on: ubuntu-latest
    needs: module_validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release
        id: version
        run: |
          chmod +x scripts/tag_increment.sh
          ./scripts/tag_increment.sh